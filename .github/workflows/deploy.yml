# Deploys nightbowl.live after CI passes on main.
#
# The `production` environment makes every run show up under Deployments on
# GitHub, linked to the live site. Repository secrets needed:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns the nightbowl Worker
#
# This builds with the Cloudflare adapter so /admin (password sign-in), /keystatic and
# /admin/subscribers run in the Worker. Repository secrets also needed, pushed to the
# Worker on every deploy: ADMIN_PASSWORD, ADMIN_SESSION_SECRET, OWNER_GITHUB_TOKEN (a
# fine-grained token with Contents read/write on this repo), KEYSTATIC_SECRET and the two

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy - nightbowl.live
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://nightbowl.live
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:cloudflare
        env:
          NIGHTBOWL_SITE_URL: https://nightbowl.live

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ADMIN_PASSWORD
            ADMIN_SESSION_SECRET
            OWNER_GITHUB_TOKEN
            KEYSTATIC_SECRET
            KEYSTATIC_GITHUB_CLIENT_ID
            KEYSTATIC_GITHUB_CLIENT_SECRET
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          OWNER_GITHUB_TOKEN: ${{ secrets.OWNER_GITHUB_TOKEN }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
